function buy(i){const k=IT[i][1],c=COST[k](U[k]);if(U[k]<IT[i][2]&&shards>=c){shards-=c;U[k]++;if(k=='h')P.hp+=20;save();shop(curN)}}

addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});

function update(dt){tt+=dt;P.yaw+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*2*dt;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch+((K.ArrowUp?1:0)-(K.ArrowDown?1:0))*1.5*dt));if(free&&!document.pointerLockElement){const ex=MX/innerWidth,ey=MY/innerHeight,z=.1;if(ex<z)P.yaw+=(z-ex)/z*2*dt;if(ex>1-z)P.yaw-=(ex-(1-z))/z*2*dt;if(ey<z)P.pitch=Math.min(1.2,P.pitch+(z-ey)/z*1.3*dt);if(ey>1-z)P.pitch=Math.max(-1.2,P.pitch-(ey-(1-z))/z*1.3*dt)}
 fireCd-=dt;P.inv-=dt;G.cd-=dt;P.hpT-=dt;recoil*=.85;
 if(P.hpT<0)P.hp=Math.min(maxHP(),P.hp+3*dt);
 const f=(K.KeyW?1:0)-(K.KeyS?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0),sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
 let wx=-sy*f+cy*s,wz=-cy*f-sy*s;const wl=Math.hypot(wx,wz);if(wl>1){wx/=wl;wz/=wl}
 const sp=K.ShiftLeft?13:9;
 if(G.on){const tg=G.tg,dx=tg.x-P.pos.x,dy=tg.y+2.4-(P.pos.y+1),dz=tg.z-P.pos.z,d=Math.hypot(dx,dy,dz);G.t+=dt;
  if(d<2.5||G.t>1.6){G.on=false;P.vel.set(-sy*7,13,-cy*7);P.jumps=1}else P.vel.set(dx/d*62,dy/d*62,dz/d*62)}
 else{const a=Math.min(1,(P.ground?14:4)*dt);P.vel.x+=(wx*sp-P.vel.x)*a;P.vel.z+=(wz*sp-P.vel.z)*a;P.vel.y=Math.max(P.vel.y-26*dt,-60)}
 if(jumpReq){jumpReq=0;if(!G.on){if(P.ground){P.vel.y=JV();P.jumps=1}else if(P.jumps<2){P.vel.y=JV()*.95;P.jumps=2}}}
 const py=P.pos.y;P.pos.addScaledVector(P.vel,dt);P.ground=false;
 if(P.vel.y<=0)for(const p of PL){if(Math.abs(P.pos.x-p.x)<p.w/2+.3&&Math.abs(P.pos.z-p.z)<p.d/2+.3&&py>=p.y-.25&&P.pos.y<=p.y){P.pos.y=p.y;P.vel.y=0;P.ground=true;P.jumps=0;if(P.on!==p)landed(p);break}}
 if(P.pos.y<cp.y-45)die();
 if(M.down&&weapon==0&&fireCd<=0)shoot();
 bossUpd(dt);mobsUpd(dt);
 CR.forEach((c,i)=>{if(!c.visible)return;c.rotation.y+=dt*2;c.position.y+=Math.sin(tt*3+i)*.003;if(c.position.distanceTo(P.pos)<2.1){c.visible=false;{const v=5*RW(c.userData.L);shards+=v;toast('+'+fmt(v)+' SHARDS')}}});
 for(let i=TR.length-1;i>=0;i--){TR[i].t-=dt;if(TR[i].t<=0){S.remove(TR[i].l);TR[i].l.geometry.dispose();TR.splice(i,1)}}
 NPC.forEach(n=>{const dx=P.pos.x-n.g.position.x,dz=P.pos.z-n.g.position.z;if(dx*dx+dz*dz<900)n.g.rotation.y=Math.atan2(-dx,-dz)});
 const nn=nearNPC();$('pr').textContent=nn&&!dlgOpen?'Press E to talk to '+nn.n:'';
 /* camera & models */
 C.rotation.set(P.pitch,P.yaw,0);const eye=new T.Vector3(P.pos.x,P.pos.y+1.7,P.pos.z),fw=fwd();
 if(P.tp){const cp2=P.pitch*.55;C.position.set(eye.x+Math.sin(P.yaw)*Math.cos(cp2)*4,eye.y+.4-Math.sin(cp2)*4,eye.z+Math.cos(P.yaw)*Math.cos(cp2)*4)}else C.position.copy(eye);
 attach();{const sp2=Math.hypot(P.vel.x,P.vel.z),a=P.ground?Math.min(1,sp2/9):0;me.ph=(me.ph||0)+dt*(2+sp2*1.1);const ph=me.ph,sw=Math.sin(ph)*.95*a,c=Math.cos(ph);
 if(P.ground){me.legL.rotation.x=sw;me.legR.rotation.x=-sw;me.kL.rotation.x=-Math.max(0,c)*1.1*a-.04;me.kR.rotation.x=-Math.max(0,-c)*1.1*a-.04;me.armL.rotation.x=-sw*.9;me.armR.rotation.x=1.2+Math.sin(ph*2)*.03*a;me.bob=Math.abs(Math.sin(ph))*.05*a+Math.sin(tt*2)*.008;me.rotation.x=-.1*a}
 else{me.legL.rotation.x=.6;me.legR.rotation.x=-.25;me.kL.rotation.x=-.9;me.kR.rotation.x=-.5;me.armL.rotation.x=-.8;me.bob=0;me.rotation.x=-.05}
 me.head.rotation.x=-P.pitch*.5;me.aura.rotation.y+=.02;if(SKINS[skin].rb){const h=tt*.15%1;me.B.emissive.setHSL(h,1,.5);me.SP.emissive.setHSL(h,1,.5);me.GL.color.setHSL(h,1,.5);me.aura.material.color.setHSL((h+.3)%1,1,.6)}}me.visible=P.tp;me.position.copy(P.pos);me.position.y+=me.bob||0;me.rotation.y=P.yaw;GV.visible=!P.tp;gun.visible=weapon==0;gr.visible=weapon==1;GV.position.z=-.6+recoil;fl.visible=recoil>.05;
 PLT.position.set(P.pos.x,P.pos.y+4,P.pos.z);for(const m of PM)m.visible=Math.abs(m.position.y-P.pos.y)<140;
 if(G.on){const o=gtip.getWorldPosition(new T.Vector3());rg.attributes.position.setXYZ(0,o.x,o.y,o.z);rg.attributes.position.setXYZ(1,G.tg.x,G.tg.y,G.tg.z);rg.attributes.position.needsUpdate=true;rope.visible=true}else rope.visible=false;
 /* HUD */
 $('tl').innerHTML='LEVEL '+lvl+' / 200<br>ALTITUDE '+Math.round(P.pos.y)+' m<br>◆ '+shards+' SHARDS<br>BOSSES '+defeated+' / 20<br>HP '+Math.ceil(P.hp)+' / '+maxHP()+' - MEDKITS '+kits+' [H]';
 $('hp').firstChild.style.width=Math.max(0,P.hp)/maxHP()*100+'%';$('w0').className=weapon==0?'on':'';$('w1').className=weapon==1?'on':''}

 const live=started&&(!!document.pointerLockElement||free)&&!dlgOpen&&!won;

 if(cut)cutUpd(dt);else if(live)update(dt);R.render(S,C)}

const SK='abyssHunterSave3';let KM=[],SP=null,loaded=0,noSave=0;
function save(){if(noSave||!started||won||cut)return;if(P.ground&&P.on)SP=[P.pos.x,P.pos.y,P.pos.z];try{localStorage.setItem(SK,JSON.stringify({kits,own,skin,cp,shards,U,defeated,lvl,sp:SP,km:KM,cr:CR.reduce((a,c,i)=>(c.visible||a.push(i),a),[])}))}catch(e){}}
setInterval(save,3000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',save);
try{const d=JSON.parse(localStorage.getItem(SK)||'null');if(d&&d.defeated<20){const q=PL.find(p=>p.cp&&Math.abs(p.cp.x-d.cp.x)<.01&&Math.abs(p.cp.z-d.cp.z)<.01);cp=q?q.cp:d.cp;shards=d.shards;kits=d.kits||0;own=d.own||[0];skin=d.skin||0;Object.assign(U,d.U);defeated=d.defeated;pending=10*(defeated+1);lvl=d.lvl||1;KM=d.km||[];SP=d.sp;(d.cr||[]).forEach(i=>{if(CR[i])CR[i].visible=false});for(let i=MB.length-1;i>=0;i--)if(KM.includes(MB[i].id)){S.remove(MB[i].g);MB.splice(i,1)}loaded=1}}catch(e){}
if(skin)applySkin(skin);P.hp=maxHP();
if(loaded){$('go').textContent='CONTINUE - LEVEL '+lvl;const b=document.createElement('button');b.id='ng';b.textContent='NEW GAME';b.style.cssText='display:none;opacity:.7';b.onclick=()=>{noSave=1;try{localStorage.removeItem(SK)}catch(e){}location.reload()};$('go').after(b)}
{const sp=SP||[cp.x,cp.y,cp.z];P.pos.set(sp[0],sp[1]+.05,sp[2])}
requestAnimationFrame(loop);

['Descending into the abyss…','Forging 50 levels of stone…','Waking ten guardians…','Charging the grapple…','Ready, Hunter.'].forEach((m,i)=>setTimeout(()=>{$('lm').textContent=m;$('bar').firstChild.style.width=(i+1)*20+'%';if(i==4){$('go').style.display='block';if($('ng'))$('ng').style.display='block'}},i*600+300));
